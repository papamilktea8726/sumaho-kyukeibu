name: Android APKを作る

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 部品をインストール
        run: npm ci

      - name: アプリ画面を作る（web/index.html → www/index.html）
        run: python3 tools/build_www.py web/index.html

      - name: Androidに反映
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 署名鍵をSecretsから用意
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets（ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD）が登録されていません"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: APKをビルド（本番署名のリリース版）
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/sumaho-kyukeibu-v1.0.${{ github.run_number }}.apk

      - name: 署名鍵を削除
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: ビルド結果を保存
        uses: actions/upload-artifact@v4
        with:
          name: sumaho-kyukeibu-apk
          path: dist/*.apk

      - name: スマホからダウンロードできるように公開（Releases）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: スマホ休憩部 テスト版 v1.0.${{ github.run_number }}
          body: |
            Androidスマホでこのページを開き、下の .apk をタップしてインストールしてください。
            （テスト版です。初回は「提供元不明のアプリ」の許可が必要です）
            ※ 2026年11月に署名鍵を新しくしました。それより前の版を入れている人は、一度アンインストールしてから入れ直してください（記録は消えます）。
          files: dist/*.apk
          make_latest: true
